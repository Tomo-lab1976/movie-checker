<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>映画チェック</title>
<style>
:root{--bg:#0f1115;--card:#191d24;--line:#303640;--text:#f7f8fa;--muted:#9aa4b2;--blue:#226fd4;--purple:#6f46c7;--red:#e25555}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:820px;margin:auto;padding:18px 14px 40px}
h1{font-size:25px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin-bottom:12px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#222831;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800}
.tab.active{background:var(--blue);border-color:var(--blue)}
.controls{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:54px 1fr 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cell{min-height:48px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.head{font-weight:800;min-height:auto}.th1{background:#482025}.th2{background:#322053}
.hour{color:var(--muted);font-size:12px;text-align:center}
.show{background:#232933;border-radius:9px;padding:7px 8px;margin:3px 0;font-size:12px;line-height:1.35}
.show b{font-size:14px}.seat{float:right;font-weight:900}.ok{color:#64d98b}.some{color:#75b8ff}.few{color:#ffb45c}.none{color:#aaa}
.nowline{border-top:2px solid var(--red)}
.notice{padding:12px;border-radius:12px;background:#201f24;color:#c4cad3;font-size:12px;line-height:1.55;margin-top:12px}
.error{background:#411f22;color:#ffc7c7}
</style>
</head>
<body><main class="wrap">
<h1>映画チェック</h1>
<div class="sub">TOHOシネマズ 八千代緑が丘 × イオンシネマ幕張新都心</div>
<div id="tabs" class="tabs"></div>
<div class="controls"><span>時間から見る</span><span id="updated"></span></div>
<div id="grid" class="grid"></div>
<div id="notice" class="notice">今日・明日は、取得できる場合のみ座席状況を表示します。その他の日は上映時間中心です。</div>
</main>
<script>
const tabs=document.getElementById("tabs"), grid=document.getElementById("grid"), notice=document.getElementById("notice");
const dates=[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()+i);return d});
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function label(d,i){if(i===0)return"今日";if(i===1)return"明日";return `${d.getMonth()+1}/${d.getDate()}(${["日","月","火","水","木","金","土"][d.getDay()]})`}
dates.forEach((d,i)=>{let b=document.createElement("button");b.className="tab";b.dataset.date=ymd(d);b.textContent=label(d,i);b.onclick=()=>load(b.dataset.date);tabs.appendChild(b)});
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function seatClass(s){return s==="◎"?"ok":s==="○"?"some":s==="△"?"few":"none"}
async function load(date){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.date===date));
 grid.innerHTML='<div class="cell">読込中…</div>'; notice.className="notice";
 try{
  const r=await fetch(`/api/schedule?date=${date}`); if(!r.ok) throw new Error("上映情報を取得できませんでした");
  const data=await r.json(); render(data);
  document.getElementById("updated").textContent=data.updated_at ? `更新 ${data.updated_at}`:"";
  if(data.warnings?.length){notice.textContent="一部の情報を取得できませんでした。映画館公式ページの変更時は修正が必要です。";notice.className="notice error"}
 }catch(e){grid.innerHTML="";notice.textContent=e.message;notice.className="notice error"}
}
function render(data){
 const all=[...(data.toho||[]).map(x=>({...x,theater:"toho"})),...(data.aeon||[]).map(x=>({...x,theater:"aeon"}))];
 const hours=[...new Set(all.map(x=>x.start?.slice(0,2)).filter(Boolean))].sort();
 let html='<div class="cell head">時刻</div><div class="cell head th1">TOHO 八千代緑が丘</div><div class="cell head th2">イオン 幕張新都心</div>';
 for(const h of hours){
   html+=`<div class="cell hour">${h}:00</div>`;
   for(const th of ["toho","aeon"]){
     html+='<div class="cell">';
     for(const x of all.filter(v=>v.theater===th && v.start.startsWith(h))){
       const seat=x.status?`<span class="seat ${seatClass(x.status)}">${esc(x.status)}</span>`:"";
       html+=`<div class="show"><b>${esc(x.start)}</b>${seat}<br>${esc(x.title)}</div>`;
     }
     html+='</div>';
   }
 }
 grid.innerHTML=html || '<div class="cell">この日の上映情報はまだありません。</div>';
}
load(ymd(dates[0]));
</script></body></html>
